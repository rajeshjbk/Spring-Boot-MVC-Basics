<html xmlns:th="http://www.thymeleaf.org">
<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet">
      
<h1 style="color:red; text-align:center"> New Doctor Registration Page</h1> <br>

<form th:action="@{/doctor/add}" method="POST" th:object="${docVO}" class="p-3 mt-4">
	<table border="0" bgcolor="cyan" align="center" class="mb-3">
		<tr>
			<td class="form-label">Doctor Name::</td>
			<td><input  type="text" th:field="*{name}" class="form-control" /></td>
		</tr>

		<tr>
			<td class="form-label">Doctor Address::</td>
			<td><input type="text" th:field="*{addrs}" class="form-control"/></td>
		</tr>

		<tr>
			<td class="form-label">Doctor Specialization::</td>
			<td><input type="text" th:field="*{specialization}" class="form-control"/></td>
		</tr>

		<tr>
			<td class="form-label">Doctor Fee::</td>
			<td><input type="text" th:field="*{fee}" class="form-control"/></td>
		</tr>
		<tr>
		   <td><input type="submit" value="Register" class="btn btn-success mt-2"></td>
		   <td><input type="reset" value="Cancel" class="btn btn-danger mt-2"></td>
		</tr>
		
	</table>
