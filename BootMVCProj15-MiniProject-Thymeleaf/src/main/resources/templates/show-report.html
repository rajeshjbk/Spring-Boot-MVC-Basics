<html xmlns:th="http://www.thymeleaf.org">
<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet">
      
<h1 style="color: red; text-align: center">Report Page</h1>
<br>

	<div class="table-responsive" th:if="${!listVO.empty}">
		<table class="table table-striped table-sm" border="1" align="center" bgcolor="cyan">
			<tr bgcolor="yellow">
				<th>Id</th>
				<th>Name</th>
				<th>Address</th>
				<th>Specialization</th>
				<th>Fee</th>
				<th>Net Fee</th>
				<th>Operations</th>
			</tr>
				<tr class="table-danger" th:each="vo:${listVO}">
					<td><span th:text="${vo.id}"/></td>
					<td><span th:text="${vo.name}"/></td>
					<td><span th:text="${vo.addrs}"/></td>
					<td><span th:text="${vo.specialization}"/></td>
					<td><span th:text="${vo.fee}"/></td>
					<td><span th:text="${vo.netFee}"/></td>
					<td><a th:href="@{/doctor/edit(no=${vo.id })}"><img th:src="@{/images/edit.jpg}" width="30" height="30"></a>
					    &nbsp; &nbsp;
					    <a th:href="@{/doctor/delete(no=${vo.id })}" onclick="return confirm('Are You sure to Delete?')"><img th:src="@{/images/delete.jpg}" width="30" height="30"></a>
					</td>
				</tr>
		</table>
	<div th:if="${listVO.empty}">
		<h1 style="color: red; text-align: center">No Records Found</h1>
	</div>
<br>

<h2 style="text-align: center; color: red"><span th:text="${resultMsg}"/></h2>
<br>
<br>
<h1 style="text-align: center">
	<a th:href="@{/doctor/add}">Add Doctor <img th:src="@{/images/add.png}" width="100" height="150"></a>
</h1>

<h1 style="text-align: center">
	<a th:href="@{/doctor/}">Home <img th:src="@{/images/home.jpg}" width="100" height="150"></a>
</h1>
